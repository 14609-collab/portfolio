<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio | Nadear</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Sarabun",sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#ffe4ec,#fff6fb,#e8f5ff,#ffeef5);
    background-size:400% 400%;
    animation:bg 15s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* กลีบซากุระ */
.sakura{
    position:absolute;
    top:-50px;
    color:#ff7eb6;
    font-size:22px;
    animation:fall linear infinite;
    opacity:.8;
}

@keyframes fall{
    from{
        transform:translateY(-50px) rotate(0deg);
    }
    to{
        transform:translateY(110vh) translateX(120px) rotate(360deg);
    }
}

.card{
    width:430px;
    background:rgba(255,255,255,.35);
    backdrop-filter:blur(18px);
    border-radius:30px;
    padding:35px;
    text-align:center;
    box-shadow:0 10px 35px rgba(255,182,193,.5);
    animation:show 1s;
}

@keyframes show{
    from{
        transform:translateY(60px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

.profile{
    width:170px;
    height:170px;
    border-radius:50%;
    overflow:hidden;
    margin:auto;
    border:6px solid white;
    box-shadow:0 0 25px #ff8fc7;
    transition:.5s;
}

.profile:hover{
    transform:scale(1.08) rotate(5deg);
}

.profile img{
    width:100%;
    height:100%;
    object-fit:cover;
}

h1{
    color:#ff4f8b;
    margin-top:20px;
    font-size:36px;
}

.jp{
    color:#b84d8a;
    font-size:20px;
    margin-bottom:15px;
}

.info{
    margin-top:20px;
    text-align:left;
    font-size:18px;
    line-height:2;
    color:#444;
}

.info b{
    color:#ff4f8b;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:15px 35px;
    text-decoration:none;
    color:white;
    background:linear-gradient(45deg,#ff8fc7,#ff5ea8);
    border-radius:40px;
    transition:.4s;
    box-shadow:0 0 20px #ff8fc7;
}

.btn:hover{
    transform:scale(1.1);
    box-shadow:0 0 35px #ff5ea8;
}

footer{
    margin-top:25px;
    color:#777;
    font-size:14px;
}
</style>
</head>

<body>
