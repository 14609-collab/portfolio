<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio | Nadear</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Sarabun",sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#ffe4ec,#fff6fb,#e8f5ff,#ffeef5);
    background-size:400% 400%;
    animation:bg 15s ease infinite;
    overflow:hidden;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* ซากุระ */

.sakura{
    position:absolute;
    top:-50px;
    font-size:22px;
    animation:fall linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-50px) rotate(0deg);
    }
    to{
        transform:translateY(110vh) translateX(120px) rotate(360deg);
    }
}

/* การ์ด */

.card{
    width:600px;
    max-width:90%;
    background:rgba(255,255,255,.35);
    backdrop-filter:blur(18px);
    padding:40px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 10px 35px rgba(255,182,193,.5);
}

/* รูป */

.profile{
    width:180px;
    height:180px;
    margin:auto;
    border-radius:50%;
    overflow:hidden;
    border:6px solid white;
    box-shadow:0 0 25px #ff8fc7;
    transition:.4s;
}

.profile:hover{
    transform:scale(1.08);
}

.profile img{
    width:100%;
    height:100%;
    object-fit:cover;
}

h1{
    margin-top:20px;
    color:#ff4f8b;
    font-size:42px;
}

.jp{
    margin:15px 0;
    font-size:24px;
    color:#b84d8a;
    font-weight:bold;
}

.info{
    line-height:2;
    font-size:19px;
    margin-top:15px;
}

/* เมนู */

.menu{
    margin-top:35px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.menu a{
    text-decoration:none;
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(10px);
    color:#ff4f8b;
    padding:20px;
    border-radius:18px;
    font-weight:bold;
    transition:.35s;
    box-shadow:0 8px 20px rgba(255,182,193,.35);
}

.menu a span{
    display:block;
    font-size:35px;
    margin-bottom:8px;
}

.menu a:hover{
    transform:translateY(-8px) scale(1.05);
    background:linear-gradient(135deg,#ff8fc7,#ff5ea8);
    color:white;
    box-shadow:0 12px 30px rgba(255,94,168,.45);
}

footer{
    margin-top:30px;
    color:#777;
    font-size:15px;
}

</style>

</head>

<body>
