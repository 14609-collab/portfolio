<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประวัติการศึกษา | นางสาววณิชญา วงศ์วิริยชาติ</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Sarabun",sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#ffe4ec,#fff6fb,#e8f5ff,#ffeef5);
    background-size:400% 400%;
    animation:bg 15s ease infinite;
    overflow:hidden;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* ซากุระ */
.sakura{
    position:absolute;
    top:-50px;
    font-size:22px;
    animation:fall linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-50px) rotate(0deg);
    }
    to{
        transform:translateY(110vh) translateX(120px) rotate(360deg);
    }
}

/* การ์ด */
.card{
    width:800px;
    max-width:90%;
    background:rgba(255,255,255,.35);
    backdrop-filter:blur(18px);
    padding:40px;
    border-radius:30px;
    box-shadow:0 10px 35px rgba(255,182,193,.5);
}

h1{
    text-align:center;
    color:#ff4f8b;
    margin-bottom:30px;
}

.timeline{
    border-left:4px solid #ff8fc7;
    padding-left:25px;
}

.item{
    margin-bottom:30px;
    position:relative;
}

.item::before{
    content:"🌸";
    position:absolute;
    left:-38px;
    top:0;
    font-size:22px;
}

.item h2{
    color:#ff4f8b;
    margin-bottom:8px;
}

.item p{
    font-size:18px;
    line-height:1.8;
}

.button{
    display:flex;
    justify-content:space-between;
    margin-top:35px;
}

.button a{
    text-decoration:none;
    background:linear-gradient(45deg,#ff8fc7,#ff5ea8);
    color:white;
    padding:14px 30px;
    border-radius:40px;
    transition:.3s;
}

.button a:hover{
    transform:scale(1.05);
}

</style>

</head>

<body>

<div class="sakura" style="left:10%;animation-duration:8s;">🌸</div>
<div class="sakura" style="left:30%;animation-duration:10s;">🌸</div>
<div class="sakura" style="left:55%;animation-duration:7s;">🌸</div>
<div class="sakura" style="left:80%;animation-duration:9s;">🌸</div>

<div class="card">

<h1>🎓 ประวัติการศึกษา</h1>

<div class="timeline">

<div class="item">
<h2>🌼 ระดับอนุบาล - ประถมศึกษา</h2>
<p>
<b>โรงเรียนอนุบาลเมืองใหม่ชลบุรี</b><br>
อนุบาล 1 - ประถมศึกษาปีที่ 6<br>
ปีการศึกษา <b>2556 - 2564</b>
</p>
</div>

<div class="item">
<h2>🌸 ระดับมัธยมศึกษา</h2>
<p>
<b>โรงเรียนพานทอง</b><br>
มัธยมศึกษาปีที่ 1 - มัธยมศึกษาปีที่ 6<br>
ปีการศึกษา <b>2565 - 2570 (กำลังศึกษา)</b>
</p>
</div>

</div>

<div class="button">
<a href="personal.html">⬅ ประวัติส่วนตัว</a>
<a href="Award.html">ผลงาน ➜</a>
</div>

</div>

</body>
</html>
