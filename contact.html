<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ติดต่อ</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Tahoma,sans-serif;
    background:linear-gradient(-45deg,#ffd6f5,#ffeefc,#ffc9e8,#ffe8f7);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:90%;
    max-width:700px;
    background:white;
    border-radius:25px;
    padding:40px;
    text-align:center;
    box-shadow:0 15px 35px rgba(255,105,180,.25);
}

h1{
    color:#ff4fa3;
    margin-bottom:10px;
    font-size:40px;
}

.subtitle{
    color:#777;
    margin-bottom:35px;
}

.contact-box{
    display:flex;
    align-items:center;
    gap:20px;
    background:#fff5fb;
    border-radius:18px;
    padding:18px 25px;
    margin:18px 0;
    transition:.3s;
}

.contact-box:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 20px rgba(255,105,180,.2);
}

.icon{
    width:60px;
    height:60px;
    background:#ff69b4;
    color:white;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
}

.info{
    text-align:left;
}

.info h3{
    color:#ff4fa3;
    margin-bottom:5px;
}

.info p,
.info a{
    color:#555;
    text-decoration:none;
    font-size:18px;
}

.footer{
    margin-top:30px;
    color:#888;
    font-size:15px;
}
</style>

</head>
<body>

<div class="container">

    <h1>Contact Me</h1>
    <p class="subtitle">สามารถติดต่อฉันได้ผ่านช่องทางด้านล่าง</p>

    <div class="contact-box">
        <div class="icon">
            <i class="fab fa-instagram"></i>
        </div>
        <div class="info">
            <h3>Instagram</h3>
            <a href="https://instagram.com/S8swuteiei" target="_blank">
                @S8swuteiei
            </a>
        </div>
    </div>

    <div class="contact-box">
        <div class="icon">
            <i class="fas fa-phone"></i>
        </div>
        <div class="info">
            <h3>Phone</h3>
            <p>089-246-9590</p>
        </div>
    </div>

    <div class="contact-box">
        <div class="icon">
            <i class="fas fa-envelope"></i>
        </div>
        <div class="info">
            <h3>Email</h3>
            <a href="mailto:wani356.dear@gmail.com">
                wani356.dear@gmail.com
            </a>
        </div>
    </div>

    <div class="footer">
        ✨ Thank you for visiting my Portfolio ✨
    </div>

</div>

</body>
</html>
